{% extends 'base.html' %}{% block title %}Log in{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card"><p class="eyebrow text-primary">WELCOME BACK</p><h1>Continue your journey.</h1><p class="text-muted mb-4">Log in to view bookings and plan your next escape.</p><form method="post"><label>Email address</label><input class="form-control" type="email" name="email" required autocomplete="email"><label>Password</label><input class="form-control" type="password" name="password" required autocomplete="current-password"><button class="btn btn-primary w-100 mt-2">Log in</button></form><p class="text-center mt-3 mb-0"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p><p class="text-center mt-3 mb-0">New to Roamwise? <a href="{{ url_for('signup') }}">Create an account</a></p></div></section>{% endblock %}
