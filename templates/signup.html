{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card"><p class="eyebrow text-primary">START EXPLORING</p><h1>Make every trip count.</h1><p class="text-muted mb-4">Save plans, set preferences and book your perfect route.</p><form method="post"><label>Full name</label><input class="form-control" name="name" required autocomplete="name"><label>Email address</label><input class="form-control" type="email" name="email" required autocomplete="email"><label>Password</label><input class="form-control" type="password" name="password" minlength="6" required autocomplete="new-password"><label>Confirm password</label><input class="form-control" type="password" name="confirm_password" minlength="6" required autocomplete="new-password"><button class="btn btn-primary w-100 mt-2">Create my account</button></form><p class="text-center mt-4 mb-0">Already a member? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
