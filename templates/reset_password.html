{% extends 'base.html' %}{% block title %}Choose a new password{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card"><p class="eyebrow text-primary">VERIFY EMAIL</p><h1>Choose a new password.</h1><p class="text-muted mb-4">Enter the code sent to {{ email }}. It expires shortly.</p><form method="post"><label>Six-digit code</label><input class="form-control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" name="otp" required autocomplete="one-time-code"><label>New password</label><input class="form-control" type="password" name="password" minlength="6" required autocomplete="new-password"><label>Confirm password</label><input class="form-control" type="password" name="confirm_password" minlength="6" required autocomplete="new-password"><button class="btn btn-primary w-100 mt-3">Update password</button></form></div></section>{% endblock %}
