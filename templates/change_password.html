{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}<section class="auth-page"><div class="auth-card"><p class="eyebrow text-primary">ACCOUNT SECURITY</p><h1>Change password.</h1><p class="text-muted mb-4">Use a strong password with at least eight characters.</p><form method="post"><label>Current password</label><input class="form-control" type="password" name="current_password" required autocomplete="current-password"><label>New password</label><input class="form-control" type="password" name="new_password" minlength="8" required autocomplete="new-password"><label>Confirm new password</label><input class="form-control" type="password" name="confirm_password" minlength="8" required autocomplete="new-password"><button class="btn btn-primary w-100 mt-3">Update password</button></form></div></section>{% endblock %}
